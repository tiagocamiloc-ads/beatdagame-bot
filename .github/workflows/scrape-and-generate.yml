name: Scrape and generate articles

on:
  schedule:
    # Every 3 hours, not once daily. Two reasons: (1) GitHub silently drops
    # or delays low-frequency scheduled workflows more often than
    # high-frequency ones -- the original once-a-day "0 8 * * *" simply
    # never fired on its first scheduled day, while publish.yml's hourly
    # cron has been reliable since day one; (2) dedup on source_url makes
    # repeat runs with nothing new essentially free, so running more often
    # only means new poker news gets picked up faster, not wasted work.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # manual trigger, e.g. for testing a single run

concurrency:
  group: scrape-and-generate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No "version" input here: pnpm/action-setup reads it from
      # package.json's "packageManager" field, and passing both causes
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @beatdagame/worker exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run scrape + generate job
        run: pnpm scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
