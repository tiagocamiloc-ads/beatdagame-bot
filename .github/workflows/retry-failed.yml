name: Retry failed articles

# Manual-only recovery tool: resets articles stuck in "failed" status (publish
# retries exhausted, e.g. during a kie.ai credit outage) back to "approved" so
# the next publish.yml run picks them up. Defaults to a dry run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually reset matched articles (unchecked = dry run, just lists them)"
        type: boolean
        default: false
      all:
        description: "Reset every failed article, not just ones with a kie.ai/image-related error"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @beatdagame/db... --filter beatdagame-bot

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run retry-failed script
        run: >
          pnpm retry-failed
          ${{ inputs.apply && '--apply' || '' }}
          ${{ inputs.all && '--all' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
